<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Monster Hunter 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- 3D 그래픽 라이브러리 (Three.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- 3D 몬스터 연출 캔버스 -->
    <div id="canvas-container"></div>

    <!-- UI 레이어 -->
    <div id="ui-layer">
        <!-- 상단 체력바 영역 -->
        <div class="status-bar">
            <div class="hp-box">
                <span>PLAYER HP</span>
                <div class="bar-bg"><div id="player-hp" class="bar-fill player" style="width: 100%;"></div></div>
            </div>
            <div class="hp-box">
                <span id="monster-name">MAGAIMAGADO (LV.1)</span>
                <div class="bar-bg"><div id="monster-hp" class="bar-fill monster" style="width: 100%;"></div></div>
            </div>
        </div>

        <!-- 콤보 및 크리티컬 이펙트 텍스트 -->
        <div id="combo-banner" class="hidden">2 COMBO! CRITICAL HIT!</div>

        <!-- 학년 및 단원 선택 창 -->
        <div id="quiz-card">
            <div id="mode-selector">
                <label for="grade-select">단원 선택: </label>
                <select id="grade-select" onchange="changeUnitMode(this.value)">
                    <option value="ELEM_ALL">초등 훈련장 (전체 과정 무작위)</option>
                    <optgroup label="중학교 1학년">
                        <option value="middle1_1">중학교 1학년 1단원 (소인수분해)</option>
                        <option value="middle1_2">중학교 1학년 2단원 (정수와 유리수)</option>
                        <option value="middle1_3" selected>중학교 1학년 3단원 (문자와 식)</option>
                        <option value="middle1_4">중학교 1학년 4단원 (좌표평면과 그래프)</option>
                    </optgroup>
                    <optgroup label="중학교 2학년">
                        <option value="middle2_1">중학교 2학년 1단원 (유리수와 순환소수)</option>
                        <option value="middle2_2">중학교 2학년 2단원 (식의 계산)</option>
                        <option value="middle2_3">중학교 2학년 3단원 (일차부등식과 연립방정식)</option>
                    </optgroup>
                    <optgroup label="고등학교 1학년">
                        <option value="high1_1">고등학교 1학년 1단원 (다항식)</option>
                        <option value="high1_2">고등학교 1학년 2단원 (방정식과 부등식)</option>
                    </optgroup>
                </select>
            </div>
            <hr class="divider">
            <div id="unit-tag">단원: <span id="current-unit">문자와 식</span></div>
            <div id="question-text">문제를 불러오는 중...</div>
            <div class="input-group">
                <input type="text" id="user-answer" placeholder="답을 입력하세요" onkeyup="if(window.event.keyCode==13){submitAnswer()}">
                <button onclick="submitAnswer()">공격하기</button>
            </div>
        </div>
    </div>

    <script src="game_engine.js"></script>
</body>
</html>
