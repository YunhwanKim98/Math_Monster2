<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Monster Hunter 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 2D 몬스터 표시 영역 -->
    <div id="monster-container">
        <img id="monster-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png" alt="Monster">
    </div>

    <!-- UI 레이어 -->
    <div id="ui-layer">
        <div class="status-bar">
            <div class="hp-box">
                <span>PLAYER HP</span>
                <div class="bar-bg"><div id="player-hp" class="bar-fill player" style="width: 100%;"></div></div>
            </div>
            <div class="hp-box">
                <span id="monster-name">MEWTWO (LV.1)</span>
                <div class="bar-bg"><div id="monster-hp" class="bar-fill monster" style="width: 100%;"></div></div>
            </div>
        </div>

        <div id="combo-banner" class="hidden">2 COMBO! CRITICAL HIT!</div>

        <div id="quiz-card">
            <div id="mode-selector">
                <label for="grade-select">단원 선택: </label>
                <select id="grade-select" onchange="changeUnitMode(this.value)">
                    <option value="middle1_3" selected>중학교 1학년 3단원 (문자와 식)</option>
                </select>
            </div>
            <hr class="divider">
            <div id="unit-tag">단원: <span id="current-unit">문자와 식</span></div>
            <div id="question-text">문제를 불러오는 중...</div>

            <div id="answer-area" class="input-group"></div>
        </div>
    </div>

    <!-- 오답 해설 모달 -->
    <div id="explanation-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">❌ Attack Failed! (오답)</h3>
            <p id="modal-explanation-text">해설 내용이 여기에 들어갑니다.</p>
            <button class="close-btn" onclick="closeExplanation()">다음 문제로</button>
        </div>
    </div>

    <script src="game_engine.js"></script>
</body>
</html>
