<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 게임 마스터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-card">
        <!-- 게임 헤더 -->
        <header class="game-header">
            <h1 class="game-title">
                <span class="controller-icon">🎮</span> 수학 유형 마스터
            </h1>
            
            <!-- 단원 및 레벨 선택 UI -->
            <div class="select-bar">
                <div class="select-group">
                    <label for="unit-select">단원 선택:</label>
                    <select id="unit-select" class="custom-select">
                        <option value="middle1_1.json">1단원: 자연수의 성질</option>
                        <option value="middle1_2.json">2단원: 정수와 유리수</option>
                        <option value="middle1_3.json">3단원: 문자와 식 & 일차방정식</option>
                    </select>
                </div>

                <div class="select-group">
                    <label for="level-select">난이도:</label>
                    <select id="level-select" class="custom-select">
                        <option value="1">Level 1</option>
                        <option value="2">Level 2</option>
                        <option value="3">Level 3</option>
                        <option value="4">Level 4</option>
                        <option value="5">Level 5</option>
                        <option value="6">Level 6</option>
                        <option value="7">Level 7</option>
                        <option value="8">Level 8</option>
                        <option value="9">Level 9</option>
                        <option value="10">Level 10</option>
                    </select>
                </div>

                <button class="btn-start" onclick="selectUnitAndLevel()">게임 시작</button>
            </div>
        </header>

        <!-- 스테이지 및 게임 상태 표시 -->
        <div class="game-status-bar">
            <div class="score-box">SCORE: <span id="current-score">0</span></div>
            <div class="hp-box">HP: <span id="hp-display">❤️❤️❤️</span></div>
        </div>

        <!-- 문제 및 보기 게임 메인 영역 -->
        <main id="game-container">
            <div class="start-message">
                <p>단원과 레벨을 선택한 후 <strong>[게임 시작]</strong> 버튼을 눌러주세요!</p>
            </div>
        </main>
    </div>

    <script src="game_engine.js"></script>
</body>
</html>
