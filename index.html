<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학 수학 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>🎮 수학 유형 마스터</h1>
        
        <div class="selector-container">
            <label for="unit-select">단원 선택:</label>
            <select id="unit-select">
                <option value="middle1_1.json">중1-1 소인수분해</option>
                <option value="middle1_3.json">중1-3 일차방정식</option>
            </select>

            <label for="level-select">난이도:</label>
            <select id="level-select">
                <option value="1">Level 1</option>
                <option value="2">Level 2</option>
                <option value="3">Level 3</option>
                <option value="4">Level 4</option>
                <option value="5">Level 5</option>
                <option value="6">Level 6</option>
                <option value="7">Level 7</option>
                <option value="8">Level 8</option>
                <option value="9">Level 9</option>
                <option value="10">Level 10</option>
            </select>

            <button onclick="selectUnitAndLevel()">문제 불러오기</button>
        </div>

        <hr>

        <div id="game-container">
            <p>단원과 레벨을 선택한 후 [문제 불러오기]를 눌러주세요.</p>
        </div>
    </div>

    <script src="game_engine.js"></script>
</body>
</html>
