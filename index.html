<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몬스터 헌터: 수학 퀘스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="top-bar">
            <div>
                <select id="unit-select" class="select-box">
                    <option value="middle1_1.json">1단원: 소인수분해</option>
                    <option value="middle1_3.json">3단원: 일차방정식</option>
                </select>
                <button onclick="startBattle()" class="select-box" style="background: var(--neon-purple); color:#fff; cursor:pointer;">퀘스트 수주</button>
            </div>
            <div class="combo-badge" id="combo-display">0 COMBO</div>
        </div>

        <div class="battle-field" id="battle-field">
            <div class="status-card">
                <div class="name-tag">⚔️ 헌터 (Player)</div>
                <div class="hp-bar-bg">
                    <div id="player-hp-fill" class="hp-fill player-hp" style="width: 100%;"></div>
                </div>
            </div>

            <div class="monster-wrapper">
                <div class="status-card" style="width: 100%; margin-bottom: 15px;">
                    <div class="name-tag" id="monster-name" style="color: var(--hp-monster);">대기 중...</div>
                    <div class="hp-bar-bg">
                        <div id="monster-hp-fill" class="hp-fill monster-hp" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="monster-img-container">
                    <img id="monster-img" src="" alt="Monster">
                </div>
            </div>
        </div>

        <main id="question-area">
            <div style="text-align: center; color: #888; padding: 30px 0;">
                [퀘스트 수주] 버튼을 누르면 토벌이 시작됩니다.
            </div>
        </main>
    </div>

    <script src="game_engine.js"></script>
</body>
</html>
