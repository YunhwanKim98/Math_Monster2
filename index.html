<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 상단 컨트롤 영역 -->
        <header class="game-header">
            <select id="unit-select">
                <option value="middle1_1.json">1단원: 소인수분해</option>
                <option value="middle1_3.json">3단원: 방어와 방정식</option>
            </select>
            <button id="start-btn">퀘스트 수주</button>
            <div class="combo-display">
                <span id="combo-count">0</span> COMBO
            </div>
        </header>

        <!-- 메인 전투 화면 -->
        <main class="battle-screen">
            <!-- 몬스터 영역 -->
            <div class="monster-area">
                <div class="status-bar">
                    <span id="monster-name">대기 중...</span>
                    <div class="hp-bar-bg">
                        <div id="monster-hp" class="hp-bar-fill monster-hp-fill" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="sprite-container">
                    <img id="monster-img" src="./images/monster1_idle.gif" alt="Monster">
                </div>
            </div>

            <!-- 플레이어 영역 -->
            <div class="player-area">
                <div class="status-bar">
                    <span class="player-label">⚔️ 헌터 (Player)</span>
                    <div class="hp-bar-bg">
                        <div id="player-hp" class="hp-bar-fill player-hp-fill" style="width: 100%;"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 하단 문제 및 선택지 영역 -->
        <footer class="quiz-container">
            <div id="question-text" class="question-box">
                [퀘스트 수주] 버튼을 누르면 몬스터 토벌이 시작됩니다.
            </div>
            <div id="options-container" class="options-grid">
                <!-- 자바스크립트에 의해 선택지 버튼 동적 생성 -->
            </div>
        </footer>
    </div>

    <script src="game_engine.js"></script>
</body>
</html>
